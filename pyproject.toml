[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylorenzmie"
version = "3.6.0"
description = "Python tools for Lorenz-Mie holographic microscopy"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "holography", "microscopy", "Lorenz-Mie", "light scattering",
    "colloids", "particle tracking", "scientific",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dgimage>=0.2.0",
    "numpy",
    "scipy",
    "pandas",
    "opencv-python",
    "pyqtgraph",
    "trackpy",
    "scikit-learn",
    "joblib",
]

[project.urls]
Homepage = "https://github.com/davidgrier/pylorenzmie"
Repository = "https://github.com/davidgrier/pylorenzmie"
Documentation = "https://pylorenzmie.readthedocs.io"
"Bug Tracker" = "https://github.com/davidgrier/pylorenzmie/issues"

[project.scripts]
lmtool = "pylorenzmie.lmtool.launch:lmtool"

[project.optional-dependencies]
gpu   = ["cupy-cuda12x"]
gui   = ["PyQt6", "tables"]
jax   = ["jax[cpu]"]
numba = ["numba"]
torch = ["torch", "triton; sys_platform == 'linux'"]
dev   = ["pytest", "pytest-cov", "opencv-python", "ruff"]
docs    = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints"]

[tool.setuptools]
packages = [
    "pylorenzmie",
    "pylorenzmie.lib",
    "pylorenzmie.theory",
    "pylorenzmie.analysis",
    "pylorenzmie.utilities",
    "pylorenzmie.lmtool",
]

[tool.setuptools.package-data]
"pylorenzmie.lmtool"     = ["*.ui", "*.png"]
"pylorenzmie"            = ["py.typed"]
"pylorenzmie.analysis"   = ["*.joblib"]
"pylorenzmie.utilities"  = ["data/*.png"]

[tool.setuptools.package-dir]
"pylorenzmie"            = "."
"pylorenzmie.lib"        = "lib"
"pylorenzmie.theory"     = "theory"
"pylorenzmie.analysis"   = "analysis"
"pylorenzmie.utilities"  = "utilities"
"pylorenzmie.lmtool"     = "lmtool"

[tool.ruff]
line-length = 79
extend-exclude = ["devel"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, SIM105 suppress,
# SIM115 file without a context manager, SIM118 key in dict, RUF015 first
# element, RUF059 unused unpacked variable, PERF401 comprehension,
# PLW0108 needless lambda, PLW1510 subprocess without check, TID252 a
# relative import of a parent (a sibling is imported as `.name`), A001 and
# A002 a name that hides a builtin, SIM300 yoda comparison, C400 and C401 a
# generator that is a comprehension, PLW2901 a loop variable that is
# overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM105",
          "SIM115", "SIM118", "PERF401", "PLW0108", "PLW1510", "RUF012",
          "RUF015", "RUF059", "RUF100", "TID252", "UP037", "A001", "A002",
          "SIM300", "C400", "C401", "PLW2901"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Notebooks unpack figures they do not use and zip lists that match.
"*.ipynb" = ["E501", "B905", "RUF059"]
# Tests import after patching, unpack to name what they do not use, and
# keep a temporary file open across a test.
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the JAX tests run only when asked for: pytest tests/test_jaxlorenzmie.py
addopts = "--ignore=tests/slow --ignore=tests/test_jaxlorenzmie.py"

[tool.pyright]
# Type checking, as in QVideo and QHOT; a CI job runs it with a pinned version,
# in an environment with Numba (``pip install -e ".[dev,numba]"``).  The
# backends that need Torch, Triton, JAX or CuPy are left out, because their
# libraries are too large for the job and their types are unknown without
# them.  lmtool/ is not checked yet: the widgets are made with ``uic`` from
# ``pyqtgraph.Qt``, whose types pyright cannot follow.
# pyright cannot read ``__all__ = 'a b'.split()``, which is the style.
include = ["lib", "theory", "analysis", "utilities", "tools"]
exclude = [
    "**/__pycache__",
    "**/devel",
    "theory/torchLorenzMie.py",
    "theory/torchLorenzMieBatch.py",
    "theory/_tritonkernel.py",
    "theory/jaxLorenzMie.py",
    "theory/cupyLorenzMie.py",
    "analysis/cupyOptimizer.py",
]
pythonVersion = "3.11"
extraPaths = [".."]
reportPrivateImportUsage = "none"
reportUnsupportedDunderAll = "none"

[tool.coverage.run]
source = ["pylorenzmie"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@classmethod",
]
show_missing = true
# What the GUI job of CI reaches (77% measured with Numba and Qt, without
# Torch, JAX or CuPy), less a point.  The accelerated kernels and the GPU
# paths are invisible to coverage or skipped without the hardware.  Only that
# job measures coverage; the others do not.
fail_under = 76
