name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # Pyright is pinned: a newer version finds new things, and they are for
    # us to fix when we choose to move (change the pin and the code together).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # one Qt binding, and no other: with PyQt5 beside it, pyright reads the
      # stubs of PyQt5
      # PyQt6 6.12.1 types every Signal(...) as missing an argument; stay on
      # 6.12.0 until a release has the stubs right
      - run: pip install -e ".[dev,numba,pyqt6]" pyright==1.1.414 PyQt6==6.12.0 PyQt6-Qt6==6.12.0
      - run: pyright

  test:
    name: Python ${{ matrix.python-version }} [${{ matrix.extras }}]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extras: ["dev,numba"]
        include:
          # without Numba the NumPy calculator is the default backend
          - python-version: "3.12"
            extras: "dev"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1

      - name: Install package and test dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest --tb=short -q

  docs:
    # Read the Docs builds with Python 3.12, without the optional libraries
    # (which docs/conf.py mocks) and with warnings as errors; build the same
    # way here so that a failure shows up before the badge turns red
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1

      - name: Install package and documentation dependencies
        run: pip install ".[docs]"

      - name: Build the documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  gui:
    # the whole suite with the widgets of lmtool, with Qt drawing to no
    # display, on each Qt binding, and on macOS, where lmtool is used
    name: GUI ${{ matrix.binding }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # PySide6 is new to lmtool; its failures do not fail the workflow yet
    continue-on-error: ${{ matrix.binding == 'pyside6' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.binding }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        binding: ["pyqt6", "pyqt5", "pyside6"]
        include:
          - os: macos-latest
            binding: pyqt6

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install package and test dependencies
        run: pip install -e ".[dev,numba,${{ matrix.binding }}]"

      # One job measures coverage, because it runs the whole suite with
      # Numba and Qt; pyproject.toml sets the floor.
      - name: Run the tests with coverage
        if: matrix.binding == 'pyqt6' && runner.os == 'Linux'
        run: python -m pytest --cov --tb=short -q

      - name: Run the tests
        if: ${{ !(matrix.binding == 'pyqt6' && runner.os == 'Linux') }}
        run: python -m pytest --tb=short -q
