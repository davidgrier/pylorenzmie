name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # the slow tests run every week, and when someone asks for them
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # Pyright is pinned: a newer version finds new things, and they are for
    # us to fix when we choose to move (change the pin and the code together).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # one Qt binding, and no other: with PyQt5 beside it, pyright reads the
      # stubs of PyQt5
      # PyQt6 6.12.1 types every Signal(...) as missing an argument; stay on
      # 6.12.0 until a release has the stubs right
      - run: pip install -e ".[dev,numba,pyqt6]" pyright==1.1.414 PyQt6==6.12.0 PyQt6-Qt6==6.12.0
      - run: pyright

  test:
    name: Python ${{ matrix.python-version }} [${{ matrix.extras }}]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        cache: pip
        cache-dependency-path: pyproject.toml
        extras: ["dev,numba"]
        include:
          # without Numba the NumPy calculator is the default backend
          - python-version: "3.12"
            extras: "dev"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1

      - name: Install package and test dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest --tb=short -q

  docs:
    # Read the Docs builds with Python 3.12, without the optional libraries
    # (which docs/conf.py mocks) and with warnings as errors; build the same
    # way here so that a failure shows up before the badge turns red
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1

      - name: Install package and documentation dependencies
        run: pip install ".[docs]"

      - name: Build the documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  gui:
    # the whole suite with the widgets of lmtool, with Qt drawing to no
    # display, on each Qt binding, and on macOS, where lmtool is used
    name: GUI ${{ matrix.binding }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # PySide6 is new to lmtool; its failures do not fail the workflow yet
    continue-on-error: ${{ matrix.binding == 'pyside6' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.binding }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        binding: ["pyqt6", "pyqt5", "pyside6"]
        include:
          - os: macos-latest
            binding: pyqt6

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install package and test dependencies
        run: pip install -e ".[dev,numba,${{ matrix.binding }}]"

      # One job measures coverage, because it runs the whole suite with
      # Numba and Qt; pyproject.toml sets the floor.
      - name: Run the tests with coverage
        if: matrix.binding == 'pyqt6' && runner.os == 'Linux'
        run: python -m pytest --cov --tb=short -q

      - name: Run the tests
        if: ${{ !(matrix.binding == 'pyqt6' && runner.os == 'Linux') }}
        run: python -m pytest --tb=short -q

  jax:
    # the JAX tests are left out of the default run, and so a change to the
    # analytical Jacobian is not tested anywhere else
    name: JAX (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,numba,jax]"

      # the default run, and the JAX tests that it leaves out
      - name: Run the tests
        run: python -m pytest -o addopts="--ignore=tests/slow" --tb=short -q

  slow:
    # the tests that take more than ten seconds each; every week, not on
    # every push
    name: Slow tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,numba]"

      - name: Run the slow tests
        run: python -m pytest -o addopts= tests/slow --tb=short -q

  package:
    # what pip installs is the wheel, not the checkout: a file that the wheel
    # lacks works everywhere but for a user
    name: Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install the wheel, not the checkout
        run: pip install "$(ls dist/*.whl)[pyqt6]"

      - name: The installed environment is consistent
        run: pip check

      - name: The command line works
        run: lmtool --help

      - name: Import the package and read its files, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          from pathlib import Path
          import pylorenzmie
          assert 'site-packages' in pylorenzmie.__file__, pylorenzmie.__file__

          # the calculation, with the weights of the network and the images
          from pylorenzmie.analysis.MLPEstimator import _default_weights
          from pylorenzmie.theory import LorenzMie, Sphere
          from pylorenzmie.utilities import example_hologram
          assert _default_weights().is_file(), _default_weights()
          model = LorenzMie(particle=Sphere(x_p=50., y_p=50., z_p=200.))
          assert model.hologram().shape == (201 * 201,)
          assert example_hologram().data.ndim == 2

          # the program, with the layouts and the splash image
          import pylorenzmie.lmtool as lmtool
          folder = Path(next(iter(lmtool.__path__)))
          for name in ('LMTool.ui', 'ALMWidget.ui', 'LMWidget.ui',
                       'ParameterWidget.ui', 'splash.png'):
              assert (folder / name).is_file(), name
          from qtpy.QtWidgets import QApplication
          app = QApplication([])
          from pylorenzmie.lmtool.ALMWidget import ALMWidget
          ALMWidget()      # reads the layout
          print('the installed package works:', pylorenzmie.__file__)
          EOF
